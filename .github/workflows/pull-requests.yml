name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  pull_request_validation:
    name: Pull Request Validation
    environment: pull-requests
    env:
      NX_FIX_CI_TRACING: true
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEDROCK_TOKEN }}
      CLAUDE_CODE_USE_BEDROCK: 1
      NX_VERBOSE_LOGGING: true
      AWS_REGION: us-east-2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Fetch base branch so Nx affected can diff against it (main may not exist in shallow/fork clones)
      - run: git fetch origin ${{ github.base_ref }}

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v4

      - run: npx nx start-ci-run --distribute-on=".nx/workflows/distribution-config.yaml" --stop-agents-after=lint,test,build,conformance-check --with-env-vars="AWS_BEARER_TOKEN_BEDROCK,CLAUDE_CODE_USE_BEDROCK,ANTHROPIC_API_KEY,AWS_REGION"
      - run: npm ci --legacy-peer-deps

      - run: npx nx-cloud record -- nx format:check
      - run: npx nx affected -t lint test build conformance-check

      # Fix CI issues
      - run: npx nx fix-ci
        if: always()
